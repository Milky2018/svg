name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Moon update
        run: moon update
      - name: Moon format check
        run: moon fmt --check
      - name: Moon info check
        run: |
          moon info
          git --no-pager diff --no-ext-diff --exit-code
          if git status --porcelain=v1 --untracked-files=all | grep -q .; then
            git status --short
            exit 1
          fi
      - name: Moon check
        run: moon check --target all --deny-warn
      - name: Moon test
        run: moon test --target all
